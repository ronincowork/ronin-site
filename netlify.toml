# Netlify: the site as it is, no build. The same rules as staticwebapp.config.json (Azure),
# which stays until Azure is taken down.
[build]
  publish = "."

# The old address: ronincowork.com and www send every visitor to the same page here, for good.
[[redirects]]
  from = "https://ronincowork.com/*"
  to = "https://www.roninhosted.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.ronincowork.com/*"
  to = "https://www.roninhosted.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/explainers/checkouts-and-worktrees"
  to = "/explainers/ronin-worktrees/"
  status = 301
  force = true

[[redirects]]
  from = "/explainers/checkouts-and-worktrees/*"
  to = "/explainers/ronin-worktrees/"
  status = 301
  force = true

# Working files ship with the repo but are never served.
[[redirects]]
  from = "/wip/*"
  to = "/404.html"
  status = 404
  force = true
